name: "03 - Publicar motores CPU y NVIDIA"

on:
  push:
    tags:
      - "engine-v*"
  workflow_dispatch:
    inputs:
      engine_version:
        description: "Version del motor"
        required: true
        default: "1.0.4"
      flavor:
        description: "Motor a construir"
        required: true
        type: choice
        default: both
        options:
          - both
          - cpu
          - nvidia

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      flavor: ${{ steps.meta.outputs.flavor }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolver version y sabores
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.engine_version }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="${REF_NAME#engine-v}"
            FLAVOR="both"
            if [[ "engine-v$VERSION" != "$REF_NAME" ]]; then
              echo "Tag de motor invalido: $REF_NAME" >&2
              exit 1
            fi
          else
            VERSION="$INPUT_VERSION"
            FLAVOR="$INPUT_FLAVOR"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version de motor invalida: $VERSION" >&2
            exit 1
          fi
          if [[ "$FLAVOR" != "both" && "$FLAVOR" != "cpu" && "$FLAVOR" != "nvidia" ]]; then
            echo "Flavor invalido: $FLAVOR" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "tag=engine-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preparar Release del motor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --target "$TARGET_SHA" --title "Voice Engine v$VERSION" --notes "Runtime descargable de Voice Studio AI. No contiene modelos de voz."
          fi

  build-cpu:
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.flavor == 'both' || needs.prepare-release.outputs.flavor == 'cpu' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Construir motor CPU
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-engine-release.ps1 -Flavor cpu -EngineVersion "${{ needs.prepare-release.outputs.version }}"
      - name: Subir partes CPU
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem .\engine-release\voice-engine-cpu-*.zip -ErrorAction SilentlyContinue)
          if ($assets.Count -eq 0) { throw "No se genero ninguna parte CPU." }
          foreach ($asset in $assets) {
            gh release upload "$env:TAG" $asset.FullName --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "No se pudo subir $($asset.Name)." }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: engine-fragment-cpu
          path: engine-release/engine-cpu.json
          if-no-files-found: error

  build-nvidia:
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.flavor == 'both' || needs.prepare-release.outputs.flavor == 'nvidia' }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Construir motor NVIDIA
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-engine-release.ps1 -Flavor nvidia -EngineVersion "${{ needs.prepare-release.outputs.version }}"
      - name: Subir partes NVIDIA
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem .\engine-release\voice-engine-nvidia-*.zip -ErrorAction SilentlyContinue)
          if ($assets.Count -eq 0) { throw "No se genero ninguna parte NVIDIA." }
          foreach ($asset in $assets) {
            gh release upload "$env:TAG" $asset.FullName --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "No se pudo subir $($asset.Name)." }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: engine-fragment-nvidia
          path: engine-release/engine-nvidia.json
          if-no-files-found: error

  publish-manifest:
    needs: [prepare-release, build-cpu, build-nvidia]
    if: >-
      ${{ always()
          && needs.prepare-release.result == 'success'
          && (needs.prepare-release.outputs.flavor == 'nvidia' || needs.build-cpu.result == 'success')
          && (needs.prepare-release.outputs.flavor == 'cpu' || needs.build-nvidia.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: engine-fragment-*
          path: fragments
          merge-multiple: true
      - name: Crear y validar manifest final
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          FLAVOR: ${{ needs.prepare-release.outputs.flavor }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone

          engines = []
          for path in glob.glob("fragments/engine-*.json"):
              with open(path, encoding="utf-8") as source:
                  engines.append(json.load(source))

          expected = {"cpu", "nvidia"} if os.environ["FLAVOR"] == "both" else {os.environ["FLAVOR"]}
          actual = {engine.get("flavor") for engine in engines}
          if actual != expected or len(engines) != len(expected):
              raise SystemExit(f"Motores incompletos: esperados={sorted(expected)}, recibidos={sorted(actual)}")

          for engine in engines:
              parts = engine.get("parts") or []
              if not parts:
                  raise SystemExit(f"{engine['flavor']} no contiene partes")
              if engine.get("version") != os.environ["VERSION"]:
                  raise SystemExit(f"Version incorrecta en {engine['flavor']}")
              if engine.get("download_bytes") != sum(part.get("bytes", 0) for part in parts):
                  raise SystemExit(f"Tamano inconsistente en {engine['flavor']}")

          manifest = {
              "schema": 1,
              "version": os.environ["VERSION"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "engines": sorted(engines, key=lambda item: item["flavor"]),
          }
          with open("engine-manifest.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
          PY
      - name: Publicar manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" engine-manifest.json --repo "${{ github.repository }}" --clobber

      # La app apunta a 'engine-latest', no a la Release versionada: la URL va
      # compilada en el instalador, así que un catálogo fijado por versión
      # dejaba a las apps antiguas viendo para siempre el motor con el que
      # salieron. Este puntero estable hace que publicar un motor alcance a
      # todas las versiones instaladas.
      - name: Actualizar puntero engine-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          if ! gh release view engine-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create engine-latest \
              --repo "${{ github.repository }}" \
              --title "Motor actual" \
              --notes "Apunta siempre al motor publicado más reciente. La aplicación consulta el engine-manifest.json de esta Release."
          fi
          gh release upload engine-latest engine-manifest.json --repo "${{ github.repository }}" --clobber
          gh release edit engine-latest --repo "${{ github.repository }}" \
            --notes "Motor actual: v$VERSION. Apunta siempre al motor publicado más reciente. La aplicación consulta el engine-manifest.json de esta Release."
      - name: Verificar assets publicados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          FLAVOR: ${{ needs.prepare-release.outputs.flavor }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets > release.json
          python - <<'PY'
          import json
          import os

          assets = {item["name"] for item in json.load(open("release.json", encoding="utf-8"))["assets"]}
          if "engine-manifest.json" not in assets:
              raise SystemExit("Falta engine-manifest.json en la Release")
          expected = {"cpu", "nvidia"} if os.environ["FLAVOR"] == "both" else {os.environ["FLAVOR"]}
          for flavor in expected:
              prefix = f"voice-engine-{flavor}-"
              if not any(name.startswith(prefix) and name.endswith(".zip") for name in assets):
                  raise SystemExit(f"Faltan partes publicadas para {flavor}")
          PY
