name: Build and Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Verify release version
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-release-version.ps1

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Prepare bundled Python + CUDA engine
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\prepare-release-engine.ps1

      - name: Verify bundled engine exists
        shell: pwsh
        run: |
          if (-not (Test-Path ".\engine-dist\qwen-engine\qwen-engine.exe")) {
            throw "PyInstaller no genero engine-dist\qwen-engine\qwen-engine.exe"
          }
          Get-ChildItem ".\engine-dist\qwen-engine\qwen-engine.exe"

      - name: Build NSIS and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Voice Studio AI v__VERSION__"
          releaseBody: |
            ## Voice Studio AI v__VERSION__

            ### Windows
            Descarga el archivo `*-setup.exe`.

            El instalador incluye la aplicación y el motor local:
            - Python runtime empaquetado
            - PyTorch / CUDA runtime
            - Qwen TTS engine
            - dependencias de audio

            Los pesos de los modelos no están incluidos.
            La primera vez que selecciones un modelo, Voice Studio AI lo descargará y lo guardará en la caché local.

            **NVIDIA:** no es necesario instalar CUDA Toolkit, pero para usar GPU necesitas un driver NVIDIA compatible.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: "Voice-Studio-AI_[version]_Windows_[arch][setup].[ext]"
