name: "02 - Crear instalador ligero Windows y publicar Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: "Compilar Setup.exe ligero"
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        shell: pwsh
        run: npm ci

      - name: Comprobar versiones
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-release-version.ps1

      - name: Cargo check
        shell: pwsh
        run: cargo check --locked --manifest-path .\src-tauri\Cargo.toml

      - name: Resolver version
        id: meta
        shell: pwsh
        run: |
          $package = Get-Content ".\package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "El tag '$env:GITHUB_REF_NAME' no coincide con '$tag'."
          }
          if ($env:GITHUB_REF_TYPE -ne "tag") {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($existingTag) {
              throw "El tag '$tag' ya existe. Incrementa la versión antes de publicar desde workflow_dispatch."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Compilar NSIS y publicar Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Voice Studio AI v${{ steps.meta.outputs.version }}"
          releaseBody: |
            ## Voice Studio AI v${{ steps.meta.outputs.version }}

            Instalador ligero de Windows.

            En el primer inicio, Voice Studio AI detecta el hardware y prepara
            visualmente el motor local CPU/NVIDIA. Python, PyTorch y Qwen no se
            instalan globalmente en Windows.

            Los modelos compatibles ya presentes se detectan automáticamente.
            Los que falten pueden instalarse desde la interfaz y quedan en la
            caché local para usarlos sin volver a descargarlos.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadWorkflowArtifacts: true

      - name: Verificar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" --json tagName,name,url,assets
