name: "02 · Crear instalador Windows y publicar Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Compilar Setup.exe y publicarlo
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Setup Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Verificar commit y fix Rust
        shell: pwsh
        run: |
          Write-Host "Commit que se está compilando:"
          git rev-parse HEAD
          git log -1 --oneline

          $rust = Get-Content ".\src-tauri\src\lib.rs" -Raw

          Write-Host ""
          Write-Host "Fragmento de cierre del engine:"
          Get-Content ".\src-tauri\src\lib.rs" |
            Select-String -Pattern "take_engine_child|terminate_engine|window.state" -Context 2,4

          if ($rust.Contains("if let Ok(mut guard) = state.0.lock()")) {
            throw @"
ESTE WORKFLOW ESTA COMPILANDO CODIGO ANTIGUO.

Se encontró la implementación Rust anterior que provoca E0597:
    if let Ok(mut guard) = state.0.lock()

No continúes con este tag/commit.
Sube primero la versión corregida y crea UN TAG NUEVO después del commit.
"@
          }

          if (-not $rust.Contains("terminate_engine(state.inner())")) {
            throw "No se encontró el fix Rust esperado en src-tauri/src/lib.rs."
          }

          Write-Host ""
          Write-Host "Fix Rust correcto detectado." -ForegroundColor Green

      - name: Resolver versión y tag de Release
        id: meta
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "El tag '$env:GITHUB_REF_NAME' no coincide con la versión '$tag' de package.json."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Versión: $version"
          Write-Host "Release tag: $tag"


- name: Comprobar referencia de ejecución
  shell: pwsh
  run: |
    Write-Host "GITHUB_REF      = $env:GITHUB_REF"
    Write-Host "GITHUB_REF_TYPE = $env:GITHUB_REF_TYPE"
    Write-Host "GITHUB_REF_NAME = $env:GITHUB_REF_NAME"
    Write-Host "GITHUB_SHA      = $env:GITHUB_SHA"
    Write-Host ""
    git status --short
    git log -1 --decorate --oneline

      - name: Comprobar versiones sincronizadas
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-release-version.ps1

      - name: Instalar dependencias frontend
        shell: pwsh
        run: npm install

      - name: Cargo check Tauri antes del empaquetado pesado
        shell: pwsh
        run: cargo check --manifest-path .\src-tauri\Cargo.toml

      - name: Preparar motor Python + PyTorch CUDA
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\prepare-release-engine.ps1

      - name: Comprobar sidecar del motor
        shell: pwsh
        run: |
          $engine = ".\engine-dist\qwen-engine\qwen-engine.exe"
          if (-not (Test-Path $engine)) {
            throw "No se generó $engine"
          }
          Get-Item $engine | Format-List FullName, Length

      - name: Compilar NSIS y publicar GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Voice Studio AI v${{ steps.meta.outputs.version }}"
          releaseBody: |
            ## Voice Studio AI v${{ steps.meta.outputs.version }}

            ### Windows
            Descarga el archivo `*-setup.exe`.

            El instalador incluye:
            - Voice Studio AI
            - motor Python empaquetado
            - PyTorch / runtime CUDA
            - qwen-tts
            - dependencias de audio

            Los pesos de los modelos se descargan desde la aplicación la primera vez
            y quedan guardados en la caché local.

            **GPU NVIDIA:** no necesitas instalar CUDA Toolkit. Sí necesitas un driver
            NVIDIA compatible para usar aceleración por GPU.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: "Voice-Studio-AI_[version]_Windows_[arch][setup].[ext]"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Voice-Studio-AI_[version]_Windows_[arch]"

      - name: Verificar que la Release realmente existe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          Write-Host "Verificando Release $env:RELEASE_TAG ..."
          gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json tagName,name,url,assets

      - name: Resumen
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          "## ✅ Release publicada" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Tag: ``$env:RELEASE_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "- Repositorio: ``${{ github.repository }}``" >> $env:GITHUB_STEP_SUMMARY
          "- El instalador también queda guardado como artifact del workflow." >> $env:GITHUB_STEP_SUMMARY
