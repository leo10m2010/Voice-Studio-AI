name: "01 · Validar código (no publica Release)"

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar frontend y código fuente
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias frontend
        shell: pwsh
        run: npm install

      - name: Comprobar versiones sincronizadas
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-release-version.ps1

      - name: Comprobar JavaScript
        shell: pwsh
        run: node --check .\src\main.js

      - name: Comprobar Python
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('engine/server.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('engine/server.py: OK')"
          python -c "from pathlib import Path; p=Path('engine/audio_mix.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('engine/audio_mix.py: OK')"
          python -c "from pathlib import Path; p=Path('engine/audio_ingest.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('engine/audio_ingest.py: OK')"

      - name: Cargo check Tauri
        shell: pwsh
        run: cargo check --manifest-path .\src-tauri\Cargo.toml

      - name: Build frontend
        shell: pwsh
        run: npm run build
