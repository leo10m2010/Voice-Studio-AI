name: "01 - Validar codigo"

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
      - "engine-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "Validar frontend, Python y Rust"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verificar commit y fix Rust
        shell: pwsh
        run: |
          Write-Host "Commit:"
          git rev-parse HEAD
          git log -1 --oneline

          $rust = Get-Content ".\src-tauri\src\lib.rs" -Raw

          if ($rust.Contains("if let Ok(mut guard) = state.0.lock()")) {
            throw "Codigo Rust antiguo detectado: state.0.lock() dentro de on_window_event. Este commit no contiene el fix E0597."
          }

          if (-not $rust.Contains("terminate_engine(state.inner(), expected_stop.inner())")) {
            throw "No se encontro el fix Rust esperado: terminate_engine(state.inner(), expected_stop.inner())."
          }

          Write-Host "Fix Rust correcto." -ForegroundColor Green

      - name: Instalar dependencias frontend
        shell: pwsh
        run: npm ci

      - name: Comprobar versiones sincronizadas
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-release-version.ps1

      - name: Comprobar JavaScript
        shell: pwsh
        run: node --check .\src\main.js

      - name: Comprobar Python
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('engine/server.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('server.py OK')"
          python -c "from pathlib import Path; p=Path('engine/audio_mix.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('audio_mix.py OK')"
          python -c "from pathlib import Path; p=Path('engine/audio_ingest.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec'); print('audio_ingest.py OK')"
          python -m py_compile .\scripts\package_engine_assets.py

      - name: Verificar ownership de engine_catalog
        shell: pwsh
        run: |
          $rust = Get-Content ".\src-tauri\src\lib.rs" -Raw
          if ($rust.Contains('map(|item| item.flavor.as_str())')) {
            throw "Regresion E0505: engine_catalog vuelve a prestar flavor desde manifest."
          }
          if ($rust.Contains('recommended_flavor: preferred.into()')) {
            throw "Regresion E0505: preferred sigue siendo un borrow antes de mover manifest."
          }
          if (-not $rust.Contains('map(|item| item.flavor.clone())')) {
            throw "No se encontro el String owned esperado para recommended_flavor."
          }

      - name: Cargo check Tauri
        shell: pwsh
        run: cargo check --locked --manifest-path .\src-tauri\Cargo.toml

      - name: Pruebas Rust del instalador
        shell: pwsh
        run: cargo test --locked --manifest-path .\src-tauri\Cargo.toml

      - name: Build frontend
        shell: pwsh
        run: npm run build
